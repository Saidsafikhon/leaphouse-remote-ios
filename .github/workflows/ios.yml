# Сборка iOS-клиента LeapRemote на macOS-раннере GitHub.
#
# Без Apple Developer подписать нечем, поэтому job собирает:
#   1) под симулятор — проверка, что код компилируется;
#   2) под устройство БЕЗ подписи — артефакт ElectroRemote-unsigned.ipa,
#      его можно подписать своим Apple ID (Sideloadly / AltStore, 7 дней)
#      или, когда появится аккаунт, — сертификатом разработчика.
name: ios

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (самый свежий на раннере)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (simulator)
        run: |
          set -o pipefail
          xcodebuild -project ElectroRemote.xcodeproj -scheme ElectroRemote -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee sim-build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" sim-build.log

      - name: Build (device, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ElectroRemote.xcodeproj -scheme ElectroRemote -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee dev-build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" dev-build.log

      - name: Package unsigned .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/LeapRemote.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist")
          zip -qr "LeapRemote-${VERSION}-${BUILD}-unsigned.ipa" Payload
          ls -la *.ipa

      # Ошибки компиляции — аннотациями и в summary: их видно без входа в GitHub.
      # Ошибки компиляции — аннотациями и в summary: их видно без входа в GitHub.
      - name: Report compile errors
        if: failure()
        run: |
          grep -hE "error:" sim-build.log dev-build.log 2>/dev/null | sed 's#/Users/runner/work/[^/]*/[^/]*/##' | sort -u > errors.txt || true
          echo "## Ошибки компиляции ($(wc -l < errors.txt))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat errors.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -40 errors.txt | while IFS= read -r l; do echo "::error::$l"; done
          # хвост лога одной аннотацией: переводы строк кодируются как %0A
          for f in sim-build.log dev-build.log; do
            [ -f "$f" ] || continue
            TAIL=$(tail -c 3500 "$f" | grep -v '^$' | awk '{printf "%s%%0A", $0}')
            echo "::error::TAIL $f%0A$TAIL"
          done

      # Неподписанный .ipa — в релиз «latest»: оттуда файл скачивается прямой ссылкой без входа.
      - name: Publish to release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA=$(ls *.ipa | head -1)
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "LeapRemote iOS (unsigned)" --notes "Последняя неподписанная сборка с main. Подписать Sideloadly/AltStore." --latest
          gh release upload latest "$IPA" --clobber
          cp "$IPA" LeapRemote-latest-unsigned.ipa
          gh release upload latest LeapRemote-latest-unsigned.ipa --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LeapRemote-unsigned-ipa
          path: |
            *.ipa
            sim-build.log
            dev-build.log
          if-no-files-found: error

  # ---- Подписанная сборка → TestFlight. Включается, когда в Secrets заданы
  # ключ App Store Connect API и Team ID; без них job пропускается. Сертификат
  # хранить не нужно: Xcode cloud signing выпускает его сам по API-ключу.
  testflight:
    runs-on: macos-15
    timeout-minutes: 40
    needs: build
    if: github.ref == 'refs/heads/main'
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Секреты ASC_* / APPLE_TEAM_ID не заданы — TestFlight пропускаем."; echo "go=no" >> "$GITHUB_OUTPUT"
          else echo "go=yes" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'

      - name: Select Xcode
        if: steps.gate.outputs.go == 'yes'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Install xcodegen and generate project
        if: steps.gate.outputs.go == 'yes'
        run: brew install xcodegen && xcodegen generate

      - name: Put API key in place
        if: steps.gate.outputs.go == 'yes'
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 ./AuthKey.p8

      - name: Archive (automatic signing, cloud-managed certificate)
        if: steps.gate.outputs.go == 'yes'
        run: |
          set -o pipefail
          xcodebuild -project ElectroRemote.xcodeproj -scheme ElectroRemote -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/ElectroRemote.xcarchive \
            -allowProvisioningUpdates -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$PWD/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_IDENTITY="Apple Development" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            archive 2>&1 | tee archive.log | grep -E "error:|warning: .*(sign|entitle)|ARCHIVE|BUILD" || true
          # Идентити для архива — только «Apple Development»: Apple Distribution при
          # автоподписи даёт «conflicting provisioning settings» (Xcode 26), а
          # дистрибутивную подпись подставляет exportArchive.
          grep -q "ARCHIVE SUCCEEDED" archive.log
          # В project.yml идентити пустая (сборка без Apple Developer), поэтому без
          # «Apple Development» архив выходил НЕПОДПИСАННЫМ и терял entitlements:
          # push не регистрировался (сборки 105/106). Проверяем право прямо в архиве.
          APP=$(ls -d build/ElectroRemote.xcarchive/Products/Applications/*.app | head -1)
          codesign -d --entitlements :- "$APP" 2>/dev/null | tee entitlements.txt | grep -q "aps-environment" \
            || { echo "::error::в архиве нет aps-environment — push работать не будет"; cat entitlements.txt; exit 1; }

      - name: Export and upload to TestFlight
        if: steps.gate.outputs.go == 'yes'
        run: |
          # destination=upload: xcodebuild сам подписывает Apple Distribution и
          # отправляет в App Store Connect по API-ключу; altool больше не нужен.
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/ElectroRemote.xcarchive -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -E "error:|EXPORT|Upload|upload" || true
          grep -q "EXPORT SUCCEEDED" export.log

      - name: Report errors
        if: failure() && steps.gate.outputs.go == 'yes'
        run: |
          for f in archive.log export.log; do
            [ -f "$f" ] || continue
            TAIL=$(grep -E "error:|warning: .*(sign|provision|profile|certificate)" "$f" | sort -u | head -30 | awk '{printf "%s%%0A", $0}')
            echo "::error::ERRORS $f%0A$TAIL"
            TAIL=$(tail -c 3000 "$f" | grep -v '^$' | awk '{printf "%s%%0A", $0}')
            echo "::error::TAIL $f%0A$TAIL"
          done

  # ---- Скриншоты для App Store: демо-режим приложения + UI-тест на симуляторе.
  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Pick simulator (6.9" / 6.7")
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -oE "iPhone 16 Pro Max|iPhone 15 Pro Max|iPhone 16 Plus|iPhone 15 Plus" | head -1)
          [ -n "$NAME" ] || { echo "нет подходящего симулятора"; xcrun simctl list devices available; exit 1; }
          UDID=$(xcrun simctl list devices available | grep "$NAME (" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"; echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 --operatorName ""
          echo "sim: $NAME $UDID"

      # Два прогона — тёмная и светлая тема (приложение в «Авто» идёт за системой).
      - name: Run UI test (screenshots, dark + light)
        run: |
          set -o pipefail
          for THEME in dark light; do
            xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance $THEME
            # чистое состояние: после первого прогона приложение остаётся «вошедшим», а тест ждёт экран входа
            xcrun simctl uninstall "${{ steps.sim.outputs.udid }}" uz.electro.remote || true
            mkdir -p "screenshots/$THEME"
            TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots/$THEME" xcodebuild test -project ElectroRemote.xcodeproj -scheme ElectroRemote \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -resultBundlePath "build/screens-$THEME.xcresult" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              2>&1 | tee "uitest-$THEME.log" | grep -E "error:|Test Case|passed|failed|BUILD|TEST" || true
            echo "--- screenshots/$THEME:"; ls -la "screenshots/$THEME" || true
            # запасной путь: вложения теста из xcresult
            if [ "$(ls screenshots/$THEME/*.png 2>/dev/null | wc -l)" -lt 5 ] && [ -d "build/screens-$THEME.xcresult" ]; then
              rm -rf attachments; mkdir -p attachments
              xcrun xcresulttool export attachments --path "build/screens-$THEME.xcresult" --output-path attachments || true
              find attachments -name "*.png" -exec cp {} "screenshots/$THEME/" \;
            fi
            echo "::notice::screenshots/$THEME: $(ls screenshots/$THEME 2>/dev/null | tr '\n' ' ')"
            test "$(ls screenshots/$THEME/*.png 2>/dev/null | wc -l)" -ge 5
          done
          cat uitest-dark.log uitest-light.log > uitest.log

      - name: Package screenshots
        run: |
          W=$(python3 -c "import struct;f=open('screenshots/dark/03-home.png','rb');f.read(16);print(struct.unpack('>I',f.read(4))[0])")
          H=$(python3 -c "import struct;f=open('screenshots/dark/03-home.png','rb');f.read(20);print(struct.unpack('>I',f.read(4))[0])")
          echo "размер $W x $H (${{ steps.sim.outputs.name }})"
          cd screenshots && zip -qr "../LeapRemote-screenshots-${W}x${H}.zip" dark light && cd ..
          ls -la *.zip

      - name: Report errors
        if: failure()
        run: |
          [ -f uitest.log ] || exit 0
          TAIL=$(grep -E "error:|failed|Assertion|не дождались" uitest.log | sort -u | head -40 | awk '{printf "%s%%0A", $0}')
          echo "::error::UITEST%0A$TAIL"
          TAIL=$(tail -c 3000 uitest.log | grep -v '^$' | awk '{printf "%s%%0A", $0}')
          echo "::error::TAIL uitest.log%0A$TAIL"

      - name: Publish to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "LeapRemote iOS (unsigned)" --notes "Последняя сборка с main." --latest
          Z=$(ls *.zip | head -1); cp "$Z" LeapRemote-screenshots-latest.zip
          gh release upload latest "$Z" LeapRemote-screenshots-latest.zip --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: LeapRemote-screenshots
          path: |
            screenshots/**/*.png
            uitest*.log
