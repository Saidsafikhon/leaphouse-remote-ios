# Проект генерируется xcodegen (`xcodegen generate`) — .xcodeproj в git не хранится.
# Версия и код сборки идут той же линией, что и Android (0.41.0 / 94).
name: ElectroRemote
options:
  bundleIdPrefix: uz.electro
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.48.1"
    CURRENT_PROJECT_VERSION: "113"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: 0.5.15
targets:
  ElectroRemote:
    type: application
    platform: iOS
    dependencies:
      - package: GLTFKit2
    sources:
      - path: ElectroRemote
        excludes:
          - "Info.plist"
          - "ElectroRemote.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.electro.remote
        PRODUCT_NAME: LeapRemote
        # Только iPhone. Настройка на уровне проекта не работает: xcodegen ставит
        # цели iOS «1,2», и App Store требует снимки для iPad 13".
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: ElectroRemote/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ElectroRemote/ElectroRemote.entitlements
        # Подпись задаётся снаружи (CI/Xcode): без Apple Developer собираем неподписанный архив.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
  ElectroRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ElectroRemoteUITests
    dependencies:
      - target: ElectroRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.electro.remote.uitests
        TEST_TARGET_NAME: ElectroRemote
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  ElectroRemote:
    build:
      targets:
        ElectroRemote: all
        ElectroRemoteUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ElectroRemoteUITests
    archive:
      config: Release
